<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Result Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student Result Management System</h1>

<!-- ADD / UPDATE FORM (covers C++ menu options 1 and 5) -->
<section class="card">
  <h2 id="formTitle">Add Student</h2>
  <form id="studentForm">
    <input type="text" id="student_id" placeholder="Student ID" required>
    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="class" placeholder="Class">
    <input type="number" id="subject1" placeholder="Subject 1 marks" required>
    <input type="number" id="subject2" placeholder="Subject 2 marks" required>
    <input type="number" id="subject3" placeholder="Subject 3 marks" required>
    <button type="submit" id="submitBtn">Add Student</button>
    <button type="button" id="cancelEditBtn" style="display:none;">Cancel</button>
  </form>
  <p id="formMessage"></p>
</section>

<!-- SEARCH (covers C++ menu option 3) -->
<section class="card">
  <h2>Search Student</h2>
  <input type="text" id="searchId" placeholder="Enter Student ID">
  <button id="searchBtn">Search</button>
  <button id="clearSearchBtn">Show All</button>
</section>

<!-- VIEW ALL (covers C++ menu option 2) -->
<section class="card">
  <h2>All Results</h2>
  <table id="resultsTable">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Class</th>
        <th>S1</th><th>S2</th><th>S3</th>
        <th>Total</th><th>Avg</th><th>%</th><th>Grade</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
</section>

<script src="script.js"></script>
</body>
</html>
